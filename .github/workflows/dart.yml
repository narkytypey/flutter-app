name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Each actions/* step is on its first Node 24 major: GitHub removed Node 20
# from its runners on 2026-09-23. subosito/flutter-action@v2 needs no change:
# from v2.23.0 its internal cache step is actions/cache@v5.
jobs:
  # Dart only: never compiles anything under android/.
  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # The only checks that compile the Kotlin engine. gradlew is git-ignored;
  # `flutter build apk` injects it, so the build has to run before the tests.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug
      - name: Kotlin JVM tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest
      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: kotlin-test-results
          path: build/app/test-results/testDebugUnitTest/*.xml
