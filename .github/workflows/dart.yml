name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Dart only: never compiles anything under android/.
  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # The only checks that compile the Kotlin engine. gradlew is git-ignored;
  # `flutter build apk` injects it, so the build has to run before the tests.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug
      - name: Kotlin JVM tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest
      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-test-results
          path: build/app/test-results/testDebugUnitTest/*.xml
